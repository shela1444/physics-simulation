<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f7fb">
<title>Mind Map Builder</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --line: #e2e8f0;
    --accent: #4f46e5;
    --accent-strong: #4338ca;
    --accent-soft: #eef2ff;
    --idea-bg: #eef2ff;
    --idea-line: #c7d2fe;
    --idea-ink: #1e1b4b;
    --idea-muted: #6366f1;
    --table-bg: #ecfdf5;
    --table-line: #a7f3d0;
    --table-head: #d1fae5;
    --table-ink: #064e3b;
    --table-muted: #059669;
    --table-grid: rgba(5, 150, 105, 0.24);
    --amber: #b45309;
    --amber-ink: #78350f;
    --amber-bg: #fffbeb;
    --amber-line: #d8b573;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow-soft: 0 10px 30px -18px rgba(15, 23, 42, 0.35);
    --shadow-float: 0 18px 48px -24px rgba(15, 23, 42, 0.55);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; padding: 0; }

  body {
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button, input { font: inherit; }
  button { color: inherit; }

  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Top bar ---------- */

  #topbar {
    position: relative;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    height: calc(62px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    background: rgba(255, 255, 255, 0.84);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
  }

  .brand-mark {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    color: #ffffff;
    background: linear-gradient(145deg, #6366f1, #4338ca 75%);
    box-shadow: 0 6px 14px -7px rgba(67, 56, 202, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .brand-mark svg { width: 20px; height: 20px; }

  #map-title {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    height: 44px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.015em;
    text-overflow: ellipsis;
    transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
  }
  #map-title::placeholder { color: var(--muted-2); }
  #map-title:hover { background: rgba(241, 245, 249, 0.7); }
  #map-title:focus {
    outline: none;
    background: var(--surface);
    border-color: rgba(79, 70, 229, 0.45);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.13);
  }

  .topbar-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, border-color 120ms ease, transform 100ms ease, box-shadow 120ms ease;
  }
  .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .btn:hover { background: #f8fafc; border-color: rgba(100, 116, 139, 0.42); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(180deg, #5b54ee, var(--accent));
    border-color: transparent;
    color: #ffffff;
    box-shadow: 0 7px 18px -9px rgba(79, 70, 229, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .btn.primary:hover { background: linear-gradient(180deg, #514ae8, var(--accent-strong)); }
  .btn.danger {
    background: var(--danger);
    border-color: transparent;
    color: #ffffff;
    box-shadow: 0 7px 18px -10px rgba(220, 38, 38, 0.9);
  }
  .btn.danger:hover { background: #b91c1c; }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; transform: none; box-shadow: none; }

  #export-btn[data-busy="true"] { opacity: 0.78; cursor: progress; }
  #export-btn .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 750ms linear infinite;
  }
  #export-btn[data-busy="true"] .spinner { display: inline-block; }
  #export-btn[data-busy="true"] .icon-export { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Canvas ---------- */

  #viewport {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background-color: var(--bg);
    background-image: radial-gradient(circle, rgba(100, 116, 139, 0.27) 1.15px, transparent 1.35px);
    background-size: 26px 26px;
    background-position: 0 0;
    cursor: grab;
  }
  #viewport.panning { cursor: grabbing; }

  #edge-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .edge-line {
    fill: none;
    stroke: #4f46e5;
    stroke-width: 2;
    stroke-linecap: round;
    pointer-events: none;
  }
  .edge.selected .edge-line { stroke: #312e81; stroke-width: 3.2; }

  .edge-hit {
    fill: none;
    stroke: rgba(0, 0, 0, 0);
    stroke-width: 16;
    pointer-events: stroke;
    cursor: pointer;
  }

  @media (hover: hover) {
    .edge:hover .edge-line { stroke: #4338ca; stroke-width: 2.7; }
    .edge.selected:hover .edge-line { stroke: #312e81; stroke-width: 3.2; }
  }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    width: 0;
    height: 0;
    transform-origin: 0 0;
    pointer-events: none;
    will-change: transform;
  }

  /* ---------- Cards ---------- */

  .card {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    box-sizing: border-box;
    width: max-content;
    min-width: 88px;
    max-width: min(320px, calc(100vw - 80px));
    pointer-events: auto;
    border: 1px solid var(--idea-line);
    border-radius: 12px;
    background: var(--idea-bg);
    color: var(--idea-ink);
    box-shadow: 0 14px 32px -22px rgba(49, 46, 129, 0.38), 0 2px 6px rgba(49, 46, 129, 0.05);
    will-change: transform;
    transition: box-shadow 130ms ease;
  }

  .card.table {
    z-index: 2;
    width: 360px;
    min-width: 240px;
    max-width: min(520px, calc(100vw - 80px));
    border-color: var(--table-line);
    background: var(--table-bg);
    color: var(--table-ink);
    box-shadow: 0 14px 32px -22px rgba(6, 78, 59, 0.36), 0 2px 6px rgba(6, 78, 59, 0.05);
  }

  .card.annotation {
    z-index: 3;
    border: 1px dashed var(--amber-line);
    background: var(--amber-bg);
    color: var(--amber-ink);
    box-shadow: 0 14px 30px -22px rgba(120, 53, 15, 0.42), 0 2px 6px rgba(120, 53, 15, 0.04);
  }

  .card:hover { z-index: 5; }
  .card.selected,
  .card:focus-within { z-index: 10; }
  .card.annotation.selected { z-index: 11; }

  .card.selected {
    box-shadow:
      0 0 0 2px var(--idea-bg),
      0 0 0 4px rgba(79, 70, 229, 0.88),
      0 18px 40px -22px rgba(49, 46, 129, 0.45);
  }
  .card.table.selected {
    box-shadow:
      0 0 0 2px var(--table-bg),
      0 0 0 4px rgba(5, 150, 105, 0.88),
      0 18px 40px -22px rgba(6, 78, 59, 0.45);
  }
  .card.annotation.selected {
    box-shadow:
      0 0 0 2px var(--amber-bg),
      0 0 0 4px rgba(180, 83, 9, 0.82),
      0 18px 40px -22px rgba(120, 53, 15, 0.45);
  }

  .card.link-source {
    box-shadow:
      0 0 0 2px var(--idea-bg),
      0 0 0 5px var(--accent),
      0 0 0 9px rgba(79, 70, 229, 0.16),
      0 18px 40px -22px rgba(15, 23, 42, 0.5);
  }
  .card.table.link-source {
    box-shadow:
      0 0 0 2px var(--table-bg),
      0 0 0 5px var(--accent),
      0 0 0 9px rgba(79, 70, 229, 0.16),
      0 18px 40px -22px rgba(15, 23, 42, 0.5);
  }

  .card.dragging {
    z-index: 50;
    box-shadow: 0 28px 60px -26px rgba(15, 23, 42, 0.58), 0 0 0 1px rgba(79, 70, 229, 0.16);
  }
  .card.dragging .card-grip { cursor: grabbing; }

  .card-grip {
    position: absolute;
    top: 50%;
    left: -28px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 28px;
    height: 44px;
    padding: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--idea-muted);
    opacity: 0;
    visibility: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 120ms ease, background-color 120ms ease, color 120ms ease;
    transform: translateY(-50%);
  }
  .card-grip::after { content: ""; position: absolute; inset: -6px; }
  .card-grip svg { width: 14px; height: 18px; pointer-events: none; }
  .card-grip:hover { background: rgba(255, 255, 255, 0.78); color: var(--accent-strong); }
  .card.annotation .card-grip { color: var(--amber); }
  .card.annotation .card-grip:hover { background: rgba(255, 255, 255, 0.7); color: var(--amber-ink); }
  .card.table .card-grip { color: var(--table-muted); }
  .card.table .card-grip:hover { background: rgba(255, 255, 255, 0.7); color: var(--table-ink); }
  .card:hover .card-grip,
  .card.selected .card-grip,
  .card:focus-within .card-grip { opacity: 1; visibility: visible; }

  .card-delete {
    position: absolute;
    top: -15px;
    right: -15px;
    z-index: 4;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(148, 163, 184, 0.4);
    border-radius: 999px;
    background: #ffffff;
    color: var(--muted);
    box-shadow: 0 5px 14px -8px rgba(15, 23, 42, 0.45);
    opacity: 0;
    visibility: hidden;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  .card-delete::after { content: ""; position: absolute; inset: -7px; }
  .card-delete svg { width: 14px; height: 14px; pointer-events: none; }
  .card-delete:hover { background: var(--danger-soft); color: var(--danger); border-color: rgba(220, 38, 38, 0.3); }
  .card.annotation .card-delete { color: var(--amber); }
  .card.table .card-delete { color: var(--table-muted); }
  .card.selected .card-delete,
  .card:focus-within .card-delete { opacity: 1; visibility: visible; }

  .card-text {
    position: relative;
    min-width: 56px;
    min-height: 22px;
    padding: 10px 14px 11px;
    border-radius: 11px;
    color: var(--idea-ink);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    cursor: text;
    outline: none;
  }
  .card.annotation .card-text { color: var(--amber-ink); }

  .card-text.is-empty::before {
    content: attr(data-placeholder);
    color: var(--idea-muted);
    font-weight: 400;
    pointer-events: none;
  }
  .card.annotation .card-text.is-empty::before { color: #b98d48; }

  .table-wrap {
    width: 100%;
    overflow: hidden;
    border-radius: 11px;
  }

  .map-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    color: var(--table-ink);
  }

  .map-table th,
  .map-table td {
    min-height: 34px;
    padding: 8px 10px;
    border-right: 1px solid var(--table-grid);
    border-bottom: 1px solid var(--table-grid);
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    vertical-align: top;
    outline: none;
  }
  .map-table th {
    background: var(--table-head);
    color: var(--table-ink);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .map-table tr:last-child td { border-bottom: 0; }
  .map-table th:last-child,
  .map-table td:last-child { border-right: 0; }
  .map-table th:focus-visible,
  .map-table td:focus-visible {
    background: rgba(255, 255, 255, 0.7);
    outline: 2px solid rgba(5, 150, 105, 0.58);
    outline-offset: -2px;
  }

  .table-tools {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
    border: 1px solid var(--table-line);
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 12px 26px -16px rgba(6, 78, 59, 0.5);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-50%);
  }
  .card.table.selected .table-tools,
  .card.table:focus-within .table-tools {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .table-tools button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 34px;
    padding: 0 6px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--table-muted);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  .table-tools button:hover { background: var(--table-bg); color: var(--table-ink); }
  .table-tools button:disabled { opacity: 0.32; cursor: not-allowed; background: transparent; }

  @media (pointer: coarse) {
    .card-grip { left: -34px; width: 34px; height: 46px; }
    .card-grip::after { inset: -5px; }
    .card-delete { width: 34px; height: 34px; }
    .card-delete::after { inset: -5px; }
    .map-table th,
    .map-table td { padding: 9px 10px; }
    .table-tools button { min-width: 44px; height: 44px; }
  }

  #viewport.link-mode .card.block,
  #viewport.link-mode .card.table,
  #viewport.link-mode .card.block .card-text,
  #viewport.link-mode .card.table .table-wrap,
  #viewport.link-mode .card.table th,
  #viewport.link-mode .card.table td { cursor: crosshair; }
  #viewport.link-mode .card .card-text,
  #viewport.link-mode .card.table .table-wrap,
  #viewport.link-mode .card.table th,
  #viewport.link-mode .card.table td { pointer-events: none; user-select: none; -webkit-user-select: none; }
  #viewport.link-mode .card .card-delete,
  #viewport.link-mode .card .card-grip,
  #viewport.link-mode .card .table-tools { pointer-events: none; opacity: 0; visibility: hidden; }

  @media (hover: hover) {
    #viewport.link-mode .card.block:hover,
    #viewport.link-mode .card.table:hover {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px rgba(79, 70, 229, 0.5), 0 18px 40px -22px rgba(15, 23, 42, 0.5);
    }
  }

  /* ---------- Overlays ---------- */

  #hint {
    position: absolute;
    top: 12px;
    left: 50%;
    z-index: 15;
    transform: translateX(-50%);
    max-width: calc(100% - 132px);
    margin: 0;
    padding: 7px 14px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.74);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    opacity: 0.92;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, opacity 150ms ease;
  }
  #hint.active {
    background: rgba(238, 242, 255, 0.95);
    border-color: rgba(79, 70, 229, 0.26);
    color: var(--accent-strong);
    font-weight: 650;
    opacity: 1;
  }

  #zoom-controls {
    position: absolute;
    right: calc(12px + env(safe-area-inset-right));
    bottom: calc(86px + env(safe-area-inset-bottom));
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-soft);
  }
  #zoom-controls button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, color 120ms ease;
  }
  #zoom-controls button svg { width: 18px; height: 18px; }
  #zoom-controls button:hover { background: #f1f5f9; color: var(--ink); }
  #zoom-controls button:active { background: #e2e8f0; }
  #zoom-controls .zoom-divider {
    width: 26px;
    height: 1px;
    margin: 1px auto;
    background: rgba(148, 163, 184, 0.28);
  }

  /* ---------- Toolbar ---------- */

  #toolbar {
    position: fixed;
    left: 50%;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: calc(100vw - 20px);
    padding: 6px;
    border: 1px solid rgba(148, 163, 184, 0.26);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
    backdrop-filter: blur(18px) saturate(145%);
    box-shadow: var(--shadow-float), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transform: translateX(-50%);
  }
  #toolbar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 56px;
    min-height: 48px;
    padding: 4px 9px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 650;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  #toolbar button svg { width: 20px; height: 20px; }
  #toolbar button:hover { background: #f1f5f9; color: var(--ink); }
  #toolbar button:active { background: #e2e8f0; }
  #toolbar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
  #toolbar button:disabled {
    opacity: 0.34;
    cursor: not-allowed;
    background: transparent;
    color: var(--muted);
  }
  #toolbar button[data-action="delete"]:not(:disabled):hover { background: var(--danger-soft); color: var(--danger); }

  .toolbar-divider {
    flex: 0 0 auto;
    width: 1px;
    height: 28px;
    margin: 0 3px;
    background: rgba(148, 163, 184, 0.3);
  }

  /* ---------- Toast ---------- */

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + env(safe-area-inset-bottom));
    z-index: 60;
    max-width: calc(100vw - 32px);
    padding: 11px 16px;
    border-radius: 11px;
    background: #0f172a;
    color: #ffffff;
    font-size: 13.5px;
    font-weight: 550;
    line-height: 1.35;
    text-align: center;
    box-shadow: 0 18px 40px -18px rgba(15, 23, 42, 0.7);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: #b91c1c; }
  #toast.success { background: #1e293b; }

  /* ---------- Dialog ---------- */

  dialog {
    width: min(420px, calc(100vw - 32px));
    max-width: none;
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - 32px);
    margin: auto;
    padding: 0;
    border: 0;
    border-radius: 18px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 40px 90px -30px rgba(15, 23, 42, 0.65);
    overflow: auto;
  }
  dialog::backdrop {
    background: rgba(15, 23, 42, 0.42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  dialog[open] { animation: dialog-in 160ms ease-out; }
  @keyframes dialog-in {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .dialog-inner { padding: 26px 24px 22px; }
  .dialog-inner h2 {
    margin: 0 0 9px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .dialog-inner p {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; }
  .dialog-actions .btn { min-width: 88px; }

  /* ---------- Focus ---------- */

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 720px) {
    #topbar {
      height: calc(60px + env(safe-area-inset-top));
      gap: 8px;
      padding-top: env(safe-area-inset-top);
      padding-left: calc(10px + env(safe-area-inset-left));
      padding-right: calc(10px + env(safe-area-inset-right));
    }
    .brand-mark { width: 31px; height: 31px; border-radius: 9px; }
    .brand-mark svg { width: 18px; height: 18px; }
    #map-title { height: 44px; font-size: 16px; padding: 0 8px; }
    .card-text { font-size: 16px; }
    .topbar-actions { gap: 6px; }
    #hint { max-width: calc(100% - 112px); font-size: 12px; padding: 6px 12px; }
    #zoom-controls { right: calc(10px + env(safe-area-inset-right)); bottom: calc(84px + env(safe-area-inset-bottom)); }
    #toolbar { bottom: calc(10px + env(safe-area-inset-bottom)); gap: 2px; padding: 5px; }
    #toolbar button { min-width: 52px; min-height: 48px; padding: 4px 7px; }
    #toast { bottom: calc(88px + env(safe-area-inset-bottom)); }
  }

  @media (max-width: 520px) {
    .topbar-actions .btn { width: 44px; min-width: 44px; padding: 0; justify-content: center; }
    .topbar-actions .btn-label { display: none; }
    .topbar-actions .btn svg { width: 19px; height: 19px; }
  }

  @media (max-width: 380px) {
    #toolbar button { min-width: 48px; font-size: 9.5px; padding: 4px 5px; }
    #toolbar button svg { width: 19px; height: 19px; }
    #hint { max-width: calc(100% - 96px); font-size: 11.5px; }
    .toolbar-divider { margin: 0 1px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand-mark" aria-hidden="true">

        <circle cx="18" cy="7.5" r="2.2"></circle>

    <label class="sr-only" for="map-title">Map title</label>

    <div class="topbar-actions">
      <button id="new-map-btn" class="btn" type="button" aria-label="New map" title="New map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M6 3.5h7l4 4V20.5H6z"></path>

      </button>
      <button id="export-btn" class="btn primary" type="button" aria-label="Export map as PNG" title="Export map as PNG" data-busy="false" aria-busy="false">
        <svg class="icon-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

    </div>
  </header>

  <main id="viewport" aria-label="Mind map canvas">
    <svg id="edge-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
          <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"></path>
        </marker>
        <marker id="arrowhead-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
          <path d="M0,0 L10,5 L0,10 Z" fill="#312e81"></path>
        </marker>
      </defs>
      <g id="edge-group"></g>
    </svg>

    <div id="world"></div>

    <div id="hint" role="status" aria-live="polite">Drag to pan</div>

    <div id="zoom-controls" role="group" aria-label="Canvas zoom controls">
      <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">

      <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M5 12h14"></path>
        </svg>
      </button>
      <div class="zoom-divider" aria-hidden="true"></div>
      <button type="button" data-zoom="fit" aria-label="Fit map to view" title="Fit map to view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

  </main>

  <nav id="toolbar" aria-label="Mind map tools">
    <button type="button" data-action="add-block" aria-label="Add idea block" title="Add idea block">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

    <button type="button" data-action="add-note" aria-label="Add annotation note" title="Add annotation note">

    </button>
    <button type="button" data-action="add-table" aria-label="Add table" title="Add table">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.6"></rect>
        <path d="M3.5 9.5h17M9 9.5v10M15 9.5v10"></path>
      </svg>
      <span class="tool-label">Table</span>
    </button>
    <button type="button" data-action="add-arrow" aria-label="Add arrow between cards" title="Add arrow between cards" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 12h15"></path>
        <path d="m14 7 5 5-5 5"></path>
      </svg>
      <span class="tool-label">Add arrow</span>
    </button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button type="button" data-action="delete" id="delete-btn" aria-label="Delete selected item" title="Delete selected item" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 7h16"></path>
        <path d="M9 7V4.5h6V7"></path>
        <path d="M6.5 7l1 13h9l1-13"></path>
        <path d="M10 11v5M14 11v5"></path>
      </svg>
      <span class="tool-label">Delete</span>
