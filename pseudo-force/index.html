<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bob hanging in a car — watch a hanging bob lean as the car accelerates.">
  <title>Bob hanging in a car — Physics Simulator</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <header class="header" role="banner">
      <div class="header__titles">
        <h1 class="header__title">Bob hanging in a car</h1>
      </div>
      <div class="header__actions">
        <span class="header__hint"><span class="kbd">Space</span> pause · <span class="kbd">R</span> reset</span>
      </div>
    </header>

    <main class="main" role="main">
      <section class="panel panel--scene" aria-label="Accelerating car scene">
        <div class="panel__header">
          <h2 class="panel__title">Accelerating Car</h2>
        </div>
        <div class="panel__content">
          <div class="canvas-wrapper">
            <canvas id="scene-canvas" width="960" height="600" aria-label="A car with a bob hanging from its roof. The road scrolls as the car accelerates."></canvas>
          </div>
        </div>
      </section>

      <aside class="sidebar" aria-label="Controls and telemetry">
        <section class="panel panel--parameters" aria-label="Parameters">
          <div class="panel__header">
            <h2 class="panel__title">Controls</h2>
          </div>
          <div class="panel__content">
            <div id="parameter-controls" class="parameter-controls"></div>
          </div>
          <div class="panel__footer">
            <div id="transport-controls" class="transport-controls" aria-label="Playback controls"></div>
          </div>
        </section>

        <section class="panel panel--hud" aria-label="Telemetry">
          <div class="panel__header">
            <h2 class="panel__title">Telemetry</h2>
          </div>
          <div class="panel__content">
            <div id="hud" class="hud" aria-live="polite">
              <div class="hud__grid">
                <div class="hud__item">
                  <span class="hud__label">Acceleration</span>
                  <span class="hud__value hud__value--accel" id="hud-acceleration">0.0 m/s²</span>
                </div>
                <div class="hud__item">
                  <span class="hud__label">Car speed</span>
                  <span class="hud__value hud__value--velocity" id="hud-velocity">0.0 m/s</span>
                </div>
                <div class="hud__item">
                  <span class="hud__label">Bob angle</span>
                  <span class="hud__value hud__value--angle" id="hud-angle">0.0° vertical</span>
                </div>
                <div class="hud__item">
                  <span class="hud__label">Pseudo force</span>
                  <span class="hud__value hud__value--pseudo" id="hud-pseudo">0.00 N</span>
                </div>
                <div class="hud__item">
                  <span class="hud__label">Bob mass</span>
                  <span class="hud__value hud__value--mass" id="hud-mass">0.50 kg</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="footer" role="contentinfo">
      <div class="status-line" id="status-line" role="status" aria-live="polite"></div>
      <div class="footer__hint">Minimal view — no force overlay, graphs, or quiz.</div>
    </footer>
  </div>

  <script src="js/namespace.js" defer></script>
  <script src="js/core/physics.js" defer></script>
  <script src="js/core/loop.js" defer></script>
  <script src="js/ui/scene.js" defer></script>
  <script src="js/ui/hud.js" defer></script>
  <script src="js/ui/parameters.js" defer></script>
  <script src="js/ui/transport.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
