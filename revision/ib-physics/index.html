<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>IB Physics - Things Must Not be Forgotten</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#dfe4ee;
  --brand:#3b5bdb; --brand2:#2743a6; --ok:#0f7b4f; --okbg:#e7f6ee;
  --warn:#9a6700; --warnbg:#fff4d6; --bad:#b42318; --badbg:#fde8e7;
  --shadow:0 10px 30px rgba(21,32,64,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1050px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;flex-direction:column;gap:1px}
.brand b{font-size:16px}.brand span{font-size:11.5px;color:var(--muted)}
main{max-width:1050px;margin:0 auto;padding:24px 20px 60px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#b9c3da;transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.ghost{background:#f8faff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hero{text-align:center;padding:20px 0 14px}
.hero h1{font-size:34px;margin:0 0 6px;letter-spacing:-.7px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.theme{margin:26px 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}}
.topic{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 15px 13px;box-shadow:0 4px 14px rgba(21,32,64,.04);transition:.16s;position:relative;overflow:hidden}
.topic:hover{transform:translateY(-2px);border-color:#b8c3dd;box-shadow:0 8px 22px rgba(21,32,64,.08)}
.topic .code{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.4px}
.topic .name{font-size:14px;font-weight:800;margin:2px 0 4px;line-height:1.25;overflow-wrap:anywhere}
.topic .count{font-size:11.5px;color:var(--muted)}
.topic.disabled{opacity:.52;background:#f1f3f8;cursor:not-allowed;box-shadow:none}
.topic.disabled:hover{transform:none;border-color:var(--line)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.2px}
.pill.topic{background:#eef2ff;color:#2f45a8}
.pill.level{background:#f2f4f7;color:#475467}
.pill.level.hl{background:var(--badbg);color:var(--bad)}
.pill.marks{background:#ecfdf3;color:var(--ok)}
.pill.counter{background:#f8faff;color:#475467;border:1px solid var(--line)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.quiz-meta{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:7px;background:#e8ecf5;border-radius:99px;overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6f8cff);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px}
@media(max-width:600px){.card{padding:17px;border-radius:14px}}
h2.q{font-size:21px;line-height:1.4;margin:8px 0 6px;letter-spacing:-.2px;overflow-wrap:anywhere;font-weight:400}
@media(max-width:600px){h2.q{font-size:18px}}
.src{font-size:10.5px;color:var(--muted);font-style:italic;margin:0 0 15px}
.select-label{display:inline-flex;align-items:center;background:#f8faff;border:1px solid #e4e9f6;border-radius:999px;padding:4px 11px;margin:0 0 10px;color:#344054;font-size:12px;font-weight:800;letter-spacing:.2px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;transition:.13s;background:#fff}
.opt:hover{border-color:#b9c3da;background:#fbfcff}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.opt .txt{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.opt.checked{border-color:#9fb4ff;background:#f1f5ff}
.opt.disabled{opacity:.55;cursor:not-allowed}
.opt.disabled:hover{border-color:var(--line);background:#fff}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted);font-weight:700}
.fb{margin-top:16px;border-radius:13px;padding:13px 15px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fb.correct{background:var(--okbg);color:var(--ok)}
.fb.almost{background:var(--warnbg);color:var(--warn)}
.fb.learn{background:var(--badbg);color:var(--bad)}
.reveal{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}
.reveal h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:0 0 8px}
.mg{border:1px solid #e9edf5;border-radius:11px;padding:10px 12px;margin:7px 0;background:#fbfcff}
.mg-label{font-size:10.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.mg ul{margin:0;padding-left:22px}
.mg li{padding:3px 0;font-size:13.5px;overflow-wrap:anywhere}
.mg li.picked{background:#ecfdf3;border-radius:6px;padding-left:6px;margin-left:-6px}
.tag{font-size:9.5px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.full{margin-top:12px;border:1px solid #e9edf5;background:#f8faff;border-radius:11px;padding:11px 13px}
.full b{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.full p{margin:5px 0 0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.note{font-size:11.5px;color:var(--muted);margin:7px 0 0}
.wrongline{font-size:12.5px;color:var(--bad);margin:8px 0 0}
.result{text-align:center;padding:34px 20px}
.result h1{font-size:30px;margin:0 0 4px}
.result p{color:var(--muted);margin:0 0 18px}
.score{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.scorebox{background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:110px}
.scorebox b{display:block;font-size:24px}
.scorebox span{font-size:11px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:none}
.hidden{display:none!important}

/* ---------- Paper 1 definition MC ---------- */
.pill.paper{background:#e8f1ff;color:#1849a9}
.pill.type{background:#f4f0ff;color:#5b3ab5}
.mc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:3px 0 11px}
.mc-src{font-size:10.5px;color:var(--muted);font-style:italic;margin:0}
.qimg-wrap{display:block;max-width:100%;margin:2px 0 0;padding:0;border:0;background:#fff;cursor:zoom-in;text-align:left;border-radius:10px;overflow:hidden}
.qimg-wrap:focus-visible{outline:3px solid #9fb4ff;outline-offset:3px}
.qimg{display:block;max-width:100%;height:auto;background:#fff;border:1px solid #eef1f7;border-radius:10px}
.zoomhint{font-size:11px;color:var(--muted);margin:6px 0 13px}
.mc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:2px 0 4px}
.mc-choice{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 8px;font-size:18px;font-weight:800;color:var(--ink);transition:.13s}
.mc-choice:hover{border-color:#9fb4ff;background:#f8faff}
.mc-choice.checked{border-color:#9fb4ff;background:#eef4ff;color:#2f45a8;box-shadow:0 0 0 2px #dbe6ff inset}
.mc-choice.correct{border-color:#6fcf97;background:var(--okbg);color:var(--ok)}
.mc-choice.wrong{border-color:#f2a6a0;background:var(--badbg);color:var(--bad)}
.mc-choice:disabled{cursor:default;opacity:1}
.mc-answer{display:flex;align-items:center;gap:10px;border:1px solid #e9edf5;background:#f8faff;border-radius:11px;padding:11px 13px;margin:7px 0}
.mc-answer b{font-size:24px;color:var(--ok)}
.mc-answer span{font-size:12px;color:var(--muted);font-weight:700}
.imgmodal{position:fixed;inset:0;z-index:60;background:rgba(10,16,31,.94);overflow:auto;padding:56px 18px 18px;display:flex;align-items:flex-start;justify-content:flex-start}
.imgmodal img{display:block;width:auto;height:auto;max-width:none;min-width:min(1400px,180vw);background:#fff;border-radius:8px;margin:0 auto}
.imgmodal-close{position:fixed;top:14px;right:14px;z-index:70;border:1px solid rgba(255,255,255,.7);background:#172033;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35)}
body.locked{overflow:hidden}

/* ---------- level gate ---------- */
.levelbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 13px;margin:0 0 18px;box-shadow:0 4px 14px rgba(21,32,64,.04)}
.levelbadge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:900;letter-spacing:.3px}
.levelcopy{flex:1;min-width:180px}.levelcopy b{display:block;font-size:13px}.levelcopy span{display:block;font-size:11px;color:var(--muted)}
.levelgate{max-width:850px;margin:10px auto 30px;padding:22px}
.levelgate h2{font-size:23px;margin:0 0 5px;letter-spacing:-.3px}
.levelgate p{margin:0 0 16px;color:var(--muted);font-size:13px}
.levelchoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.levelchoice{text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:18px;cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(21,32,64,.04)}
.levelchoice:hover{transform:translateY(-2px);border-color:#9fb4ff;box-shadow:0 9px 24px rgba(21,32,64,.09)}
.levelchoice .big{font-size:31px;font-weight:900;color:var(--brand);line-height:1}
.levelchoice .name{font-size:14px;font-weight:900;margin:3px 0 7px}
.levelchoice .count{font-size:12px;font-weight:800;color:#344054}
.levelchoice .desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
.levelnote{font-size:11px;color:var(--muted);margin:14px 0 0!important}
@media(max-width:600px){.levelgate{padding:16px}.levelchoices{grid-template-columns:1fr}.levelbar{padding:9px 10px}.levelbadge{height:31px;min-width:38px;font-size:14px}.levelcopy span{font-size:10px}}

/* ---------- mobile refinements ---------- */
html,body{overflow-x:hidden}
body{-webkit-text-size-adjust:100%}
@media(max-width:600px){
  .topbar-in{padding:10px 14px;gap:8px}
  .brand b{font-size:15px}
  .brand span{font-size:10px}
  .topbar .btn{padding:7px 10px;font-size:12px}
  main{padding:16px 14px 48px}
  .hero{padding:12px 0 10px}
  .hero h1{font-size:26px;line-height:1.15}
  .hero p{font-size:13px}
  .theme{font-size:11px;margin:20px 0 8px;letter-spacing:1px}
  .grid{grid-template-columns:1fr;gap:9px}
  .topic{padding:14px;border-radius:13px}
  .topic .name{font-size:14px}
  .quiz-top{align-items:flex-start;gap:8px;margin-bottom:8px}
  .quiz-meta{gap:4px}
  .pill{font-size:9.5px;padding:3px 8px}
  .card{padding:15px;border-radius:14px}
  h2.q{font-size:17px;line-height:1.35;margin:6px 0 5px}
  .src{font-size:9.5px;margin-bottom:10px}
  .select-label{font-size:11px;padding:3px 9px;margin-bottom:8px}
  .opt{padding:12px 11px;margin:7px 0;min-height:44px;border-radius:11px}
  .opt input{width:20px;height:20px;margin-top:1px}
  .opt .txt{font-size:14px;line-height:1.4}
  .btn{min-height:44px}
  .footer{flex-direction:column;align-items:stretch;gap:10px}
  .footer>.count{text-align:center}
  .footer>div{width:100%;display:flex;gap:8px}
  .footer>div .btn{flex:1}
  .fb{font-size:13px;padding:11px 12px}
  .reveal h3{font-size:11px}
  .mg{padding:9px 10px}
  .mg li{font-size:13px}
  .full{padding:10px 11px}
  .full p{font-size:12.5px}
  .result{padding:24px 14px}
  .result h1{font-size:23px;line-height:1.3}
  .result p{font-size:13.5px}
  .score{gap:7px}
  .scorebox{flex:1;min-width:90px;padding:10px 8px}
  .scorebox b{font-size:21px}
  .scorebox span{font-size:10px}
  .mc-grid{gap:7px}
  .mc-choice{min-height:52px;font-size:17px;padding:10px 6px}
  .mc-head{margin-bottom:9px}
  .mc-src{font-size:9.5px}
  .imgmodal{padding:54px 8px 8px}
  .imgmodal img{min-width:170vw}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <b>IB Physics - Things Must Not be Forgotten</b>
      <span>IB Physics Paper 1 + Paper 2 · topic quiz</span>
    </div>
    <button class="btn ghost hidden" id="changeTopicBtn" onclick="goTopics()">Change topic</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="imgmodal hidden" id="imgModal" role="dialog" aria-modal="true" aria-label="Question image zoom" onclick="closeZoom(event)">
  <button class="imgmodal-close" type="button" onclick="closeZoom()">Close ×</button>
  <img id="zoomImg" alt="">
</div>

<script>
const DATA = {"topics":[["A1","Kinematics"],["A2","Forces and momentum"],["A3","Work, energy and power"],["A4","Rigid body mechanics"],["A5","Galilean and special relativity"],["B1","Thermal energy transfers"],["B2","Greenhouse effect"],["B3","Gas laws"],["B4","Thermodynamics"],["B5","Current and circuits"],["C1","Simple harmonic motion"],["C2","Wave model"],["C3","Wave phenomena"],["C4","Standing waves and resonance"],["C5","Doppler effect"],["D1","Gravitational fields"],["D2","Electric and magnetic fields"],["D3","Motion in electromagnetic fields"],["D4","Induction"],["E1","Structure of the atom"],["E2","Quantum physics"],["E3","Radioactive decay"],["E4","Fission"],["E5","Fusion and stars"],["T3","Mathematics (units and measurement)"]],"questions":[{"id":"q001","topic":"B1","topic_title":"Thermal energy transfers","label":"[SL + HL]","question":"Define heat capacity.","marks":1,"markGroups":[{"mark":1,"options":["Energy required to raise temperature of object by 1 K / 1 °C","mass × specific heat capacity"]}],"fullAnswer":"Energy required to raise temperature of object by 1 K / 1 °C OR mass × specific heat capacity","valid":["Energy required to raise temperature of object by 1 K / 1 °C","mass × specific heat capacity"],"candidates":[{"text":"The total thermal energy contained in an object at a given temperature.","source":"expert-authored","flags":[]},{"text":"The energy required to change the state of 1 kg of a substance without changing its temperature.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q3(b)(i); 2015 TZ1 HL Q7(b)(i)","custom":false,"distractors":["The total thermal energy contained in an object at a given temperature.","The energy required to change the state of 1 kg of a substance without changing its temperature.","Energy required to raise temperature of 1kg object by 1 K / 1 °C"]},{"id":"q002","topic":"B2","topic_title":"Greenhouse effect","label":"[SL + HL]","question":"State what is meant by the enhanced greenhouse effect.","marks":2,"markGroups":[{"mark":1,"options":["Addition of greenhouse gases/named greenhouse gas to the atmosphere"]},{"mark":2,"options":["Increasing the temperature of the Earth’s surface/global warming"]}],"fullAnswer":"Addition of greenhouse gases/named greenhouse gas to the atmosphere; Increasing the temperature of the Earth’s surface/global warming","valid":["Addition of greenhouse gases/named greenhouse gas to the atmosphere","Increasing the temperature of the Earth’s surface/global warming"],"candidates":[{"text":"The reflection of incoming solar radiation back into space by the atmosphere.","source":"expert-authored","flags":[]},{"text":"The natural greenhouse effect caused only by water vapour, with no change in atmospheric composition.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q4(d)(i); 2015 TZ1 HL Q6(d)(i)","custom":false,"distractors":["The reflection of incoming solar radiation back into space by the atmosphere.","The natural greenhouse effect caused only by water vapour, with no change in atmospheric composition."]},{"id":"q003","topic":"B5","topic_title":"Current and circuits","label":"[SL + HL]","question":"Define electromotive force (emf).","marks":1,"markGroups":[{"mark":1,"options":["The work done per unit charge in moving a quantity of charge completely around a circuit","the power delivered per unit current","work done per unit charge made available by a source"]}],"fullAnswer":"The work done per unit charge in moving a quantity of charge completely around a circuit OR the power delivered per unit current OR work done per unit charge made available by a source","valid":["The work done per unit charge in moving a quantity of charge completely around a circuit","the power delivered per unit current","work done per unit charge made available by a source"],"candidates":[{"text":"The total charge that passes through a cell per unit time.","source":"expert-authored","flags":[]},{"text":"The energy dissipated in the external circuit per unit charge.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q5(a)(i); 2015 TZ1 HL Q3(a)","custom":false,"distractors":["The total charge that passes through a cell per unit time.","The energy dissipated in the external circuit per unit charge."]},{"id":"q004","topic":"C1","topic_title":"Simple harmonic motion","label":"[SL + HL]","question":"Define simple harmonic motion (SHM).","marks":2,"markGroups":[{"mark":1,"options":["motion in which acceleration is proportional to the displacement from the equilibrium position","motion in which restoring force is proportional to the displacement from the equilibrium position"]},{"mark":2,"options":["Directed towards the equilibrium position","Directed in the opposite direction to the displacement"]}],"fullAnswer":"motion in which acceleration is proportional to the displacement from the equilibrium position OR motion in which restoring force is proportional to the displacement from the equilibrium position; Directed towards the equilibrium position OR Directed in the opposite direction to the displacement","valid":["motion in which acceleration is proportional to the displacement from the equilibrium position","motion in which restoring force is proportional to the displacement from the equilibrium position","Directed towards the equilibrium position","Directed in the opposite direction to the displacement"],"candidates":[{"text":"Motion in which the speed is proportional to the displacement from equilibrium.","source":"expert-authored","flags":[]},{"text":"Motion in which the acceleration is constant and always in the direction of motion.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q5(c); 2015 TZ1 HL Q8(e)","custom":false,"distractors":["Motion in which the speed is proportional to the displacement from equilibrium.","Motion in which the acceleration is constant and always in the direction of motion.","motion in which acceleration is proportional to the velocity"]},{"id":"q005","topic":"B  molecules do not absorb energy during melting.","The molecules stop vibrating completely during melting, so the temperature remains constant."]},{"id":"q040","topic":"B2","topic_title":"Greenhouse effect","label":"[SL + HL]","question":"Outline the mechanism by which greenhouse gases contribute to global warming.","marks":3,"markGroups":[{"mark":1,"options":["Radiation emitted by Earth in (long wavelength) infrared region"]},{"mark":2,"options":["Frequency corresponds to resonant frequency of greenhouse gases (either vibration or difference in energy levels)"]},{"mark":3,"options":["Radiation absorbed by greenhouse gases is (partly) re-radiated back to Earth"]}],"fullAnswer":"Radiation emitted by Earth in (long wavelength) infrared region; Frequency corresponds to resonant frequency of greenhouse gases (either vibration or difference in energy levels); Radiation absorbed by greenhouse gases is (partly) re-radiated back to Earth","valid":["Radiation emitted by Earth in (long wavelength) infrared region","Frequency corresponds to resonant frequency of greenhouse gases (either vibration or difference in energy levels)","Radiation absorbed by greenhouse gases is (partly) re-radiated back to Earth"],"candidates":[{"text":"The greenhouse gases reflect incoming ultraviolet radiation before it reaches the Earth's surface.","source":"expert-authored","flags":[]},{"text":"The greenhouse gases absorb visible light and convert it directly into thermal energy without re-emitting it.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q4(d)(ii); 2015 TZ1 HL Q6(d)(ii)","custom":false,"distractors":["The greenhouse gases reflect incoming ultraviolet radiation before it reaches the Earth's surface.","The greenhouse gases absorb visible light and convert it directly into thermal energy without re-emitting it."]},{"id":"q041","topic":"E3","topic_title":"Radioactive decay","label":"[SL]","question":"Explain, in terms of the number of nucleons and the forces between them, why calcium-40 is stable and calcium-47 is radioactive.","marks":3,"markGroups":[{"mark":1,"options":["Ca-40 has 20 protons and 20 neutrons, Ca-47 has 20 protons and 27 neutrons / Ca-47 has 7 additional neutrons"]},{"mark":2,"options":["Strong nuclear force is attractive for nucleons within short range","electrostatic force between protons are repulsive"]},{"mark":3,"options":["Excess neutrons leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force","too high a neutron-to-proton ration leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force"]}],"fullAnswer":"Ca-40 has 20 protons and 20 neutrons, Ca-47 has 20 protons and 27 neutrons / Ca-47 has 7 additional neutrons; Strong nuclear force is attractive for nucleons within short range OR electrostatic force between protons are repulsive; Excess neutrons leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force OR too high a neutron-to-proton ration leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force","valid":["Ca-40 has 20 protons and 20 neutrons, Ca-47 has 20 protons and 27 neutrons / Ca-47 has 7 additional neutrons","Strong nuclear force is attractive for nucleons within short range","electrostatic force between protons are repulsive","Excess neutrons leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force","too high a neutron-to-proton ration leads to the electrostatic’ electromagnetic force being greater than the strong nuclear force"],"candidates":[{"text":"Ca-47 is radioactive because it has too few neutrons for the number of protons, so the strong force cannot balance the electrostatic repulsion.","source":"expert-authored","flags":[]},{"text":"Ca-40 is stable because it contains equal numbers of protons and electrons, which cancel the electrostatic repulsion.","source":"expert-authored","flags":[]}],"source":"2015 TZ1 SL Q6(f)","custom":false,"distractors":["Ca-47 is radioactive because it has too few neutrons for the number of protons, so the strong force cannot balance the electrostatic repulsion.","Ca-40 is stable because it contains equal numbers of protons and electrons, which cancel the electrostatic repulsion."]},{"id":"q042","topic":"C4","topic_title":"Standing waves and resonance","label":"[SL + HL]","question":"Describe how a standing wave is formed.","marks":2,"markGroups":[{"mark":1,"options":["The superposition of"]},{"mark":2,"options":["two travelling waves moving in opposite direction"]}],"fullAnswer":"The superposition of; two travelling waves moving in opposite direction","valid":["The superposition of","two travelling waves moving in opposite direction"],"candidates":[{"text":"A single travelling wave reflects from a boundary and continues in the same direction.","source":"expert-authored","flags":[]},{"text":"Two waves of different frequencies travel in the same direction and add together.","source":"expert-authored","flags":[]}],"source":"2016 TZ0 HL Q4(d)(i)","custom":false,"distractors":["A single travelling wave reflects from a boundary and continues in the same direction.","Two waves of same frequencies","travel in the same direction and add together"]},{"id":"q044","topic":"E1","topic_title":"Structure of the atom","label":"[SL + HL]","question":"Outline, with reference to atomic energy levels, how an emission spectrum of helium gas is formed.","marks":3,"markGroups":[{"mark":1,"options":["Electron/atom drops from high energy level to low state."]},{"mark":2,"options":["Energy levels are discrete."]},{"mark":3,"options":["Wavelength/frequency of photon is related to energy change or quotes E = hf or E = hc/λ and is therefore also discrete."]}],"fullAnswer":"Electron/atom drops from high energy level to low state.; Energy levels are discrete.; Wavelength/frequency of photon is related to energy change or quotes E = hf or E = hc/λ and is therefore also discrete. ) speed/larger (average) KE of molecules/particles/atoms","Increased force/momentum transferred to walls (per collision) / more frequent collisions with walls","Increased force leads to increased pressure because P=F/A (as area remains constant)"],"candidates":[{"text":"A higher temperature increases the volume of the gas particles, so they collide less often with the walls.","source":"expert-authored","flags":[]},{"text":"A higher temperature increases the number of gas particles, which increases the pressure.","source":"expert-authored","flags":[]}],"source":"2018 TZ1 SL Q2(c); 2018 TZ1 HL Q2(c)","custom":false,"distractors":["A higher temperature increases the volume of the gas particles, so they collide less often with the walls.","A higher temperature increases the number of gas particles, which increases the pressure."]},{"id":"q048","topic":"D3","topic_title":"Motion in electromagnetic fields","label":"[SL + HL]","question":"Explain why the electron moves at constant speed in a magnetic field.","marks":2,"markGroups":[{"mark":1,"options":["the magnetic force/acceleration is perpendicular to moving direction/ velocity"]},{"mark":2,"options":["The magnetic force does not do work on the electron hence does not change the electron’s kinetic energy"]}],"fullAnswer":"the magnetic force/acceleration is perpendicular to moving direction/ velocity; The magnetic force does not do work on the electron hence does not change the electron’s kinetic energy","valid":["the magnetic force/acceleration is perpendicular to moving direction/ velocity","The magnetic force does not do work on the electron hence does not change the electron’s kinetic energy"],"candidates":[{"text":"The magnetic force is parallel to the electron's velocity, so it cannot change the speed.","source":"expert-authored","flags":[]},{"text":"The electric field cancels the magnetic force, so the electron moves at constant speed.","source":"expert-authored","flags":[]}],"source":"2018 TZ1 SL Q5(c)(i); 2018 TZ1 HL Q5(c)(i)","custom":false,"distractors":["The magnetic force is parallel to the electron's velocity, so it cannot change the speed.","No force is acting on the electron"]},{"id":"q050","topic":"B1","topic_title":"Thermal energy transfers","label":"[SL + HL]","question":"Discuss how the frequency of the radiation emitted by a black body can be used to estimate the temperature of the body.","marks":2,"markGroups":[{"mark":1,"options":["The (peak) wavelength of emitted em waves depends on temperature of emitter/reference to Wein’s Law"]},{"mark":2,"options":["So frequency/color depends on temperature"]}],"fullAnswer":"The (peak) wavelength of emitted em waves depends on temperature of emitter/reference to Wein’s Law; So frequency/color depends on temperature","valid":["The (peak) wavelength of emitted em waves depends on temperature of emitter/reference to Wein’s Law","So frequency/color depends on temperature"],"candidates":[{"text":"The frequency of radiation is independent of temperature; only the intensity changes.","source":"expert-authored","flags":[]},{"text":"As temperature increases, the peak wavelength increases and the frequency decreases.","source":"expert-authored","flags":[]}],"source":"2018 TZ1 SL Q6(c)(ii); 2018 TZ1 HL Q6(c)(ii)","custom":false,"distractors":["The frequency of radiation is independent of temperature; only the intensity changes.","As temperature increases, the peak wavelength increases and the frequency decreases."]},{"id":"q051","topic":"C3","topic_title":"Wave phenomena","label":"[SL + HL]","question":"Outline why the beam has to be coherent in order for the fringes to be visible in double slit experiment.","marks":1,"markGroups":[{"mark":1,"options":["Light waves must have constant phase difference"]}],"fullAnswer":"Light waves must have constant phase difference","valid":["Light waves must have constant phase difference"],"candidates":[{"text":"The light waves must have the same amplitude and travel in the same direction.","sour .","source":"expert-authored","flags":[]}],"source":"2019 TZ2 HL Q11(a)","custom":false,"distractors":["De Broglie's hypothesis says the electron does not orbit around nucleus."]},{"id":"q061","topic":"E1","topic_title":"Structure of the atom","label":"[HL only]","question":"The ratio volume of a nucleus of mass number A / volume of a nucleon is approximately A. Comment on this observation by reference to the strong nuclear force.","marks":2,"markGroups":[{"mark":1,"options":["This implies that the nucleons are very tightly packed/that there is very little space in between the nucleons","This implies that there is very little space in between the nucleons"]},{"mark":2,"options":["Because the nuclear force is stronger than the electrostatic force"]}],"fullAnswer":"This implies that the nucleons are very tightly packed/that there is very little space in between the nucleons OR This implies that there is very little space in between the nucleons; Because the nuclear force is stronger than the electrostatic force","valid":["This implies that the nucleons are very tightly packed/that there is very little space in between the nucleons","This implies that there is very little space in between the nucleons","Because the nuclear force is stronger than the electrostatic force"],"candidates":[{"text":"The result shows that nucleons are widely spaced, with most of the nucleus empty space.","source":"expert-authored","flags":[]},{"text":"The result shows that the electrostatic force is stronger than the nuclear force at nuclear distances.","source":"expert-authored","flags":[]}],"source":"2019 TZ2 HL Q11(b)(ii)","custom":false,"distractors":["because the electrostatic force is stronger than the nuclear force at nuclear distances."]},{"id":"q062","topic":"D1","topic_title":"Gravitational fields","label":"[SL + HL]","question":"Explain why a centripetal force is needed for the planet to be in a circular orbit.","marks":2,"markGroups":[{"mark":1,"options":["circular motion involves ; 2021 TZ1 HL Q7(d)(i)","custom":false,"distractors":["High temperature is needed to increase the gravitational attraction between the nuclei."]},{"id":"q064","topic":"C4","topic_title":"Standing waves and resonance","label":"[SL + HL]","question":"Outline how a standing wave is produced on the string.","marks":3,"markGroups":[{"mark":1,"options":["travelling wave moves along the length of the string and reflects at fixed end"]},{"mark":2,"options":["superposition/interference of incident and reflected waves"]},{"mark":3,"options":["the superposition of the reflections is reinforced only for certain wavelengths"]}],"fullAnswer":"travelling wave moves along the length of the string and reflects at fixed end; superposition/interference of incident and reflected waves; the superposition of the reflections is reinforced only for certain wavelengths","valid":["travelling wave moves along the length of the string and reflects at fixed end","superposition/interference of incident and reflected waves","the superposition of the reflections is reinforced only for certain wavelengths"],"candidates":[{"text":"The wave is absorbed at the fixed end, so no reflected wave is produced.","source":"expert-authored","flags":[]},{"text":"All wavelengths produce a standing wave because the superposition always reinforces.","source":"expert-authored","flags":[]}],"source":"2021 TZ1 SL Q6(a); 2021 TZ1 HL Q8(a)","custom":false,"distractors":["The wave is absorbed at the fixed end, so no reflected wave is produced.","All wavelengths produce a standing wave because the superposition always reinforces."]},{"id":"q065","topic":"E3","topic_title":"Radioactive decay","label":"[SL + HL]","question":"The neutron number N and the proton number Z are not equal for the nuclide ²⁰⁵₈₁Tl. Explain, with reference to the forces acting within the nucleus, the reason for this.","marks":2,"markGroups":[{"mark":1,"options":["proton repulsion and nucleon attraction"]},{"mark":2,"options":["strong force is short range","electrostatic/electromagnetic force is long range"]},{"mark":3,"options":["more neutrons than protons needed to hold nucleus together"]}],"fullAnswer":"proton repulsion and nucleon attraction; strong force is short range OR electrostatic/electromagnetic force is long range; more neutrons than protons needed to hold nucleus together","valid":["proton repulsion and nucleon attraction","strong force is short range","electrostatic/electromagnetic force is long range","more neutrons than protons needed to hold nucleus together"],"candidates":[{"text":"The nucleus has too many neutrons, so the strong force becomes repulsive and the nucleus is unstable.","source":"expert-authored","flags":[]},{"text":"The neutron number is greater than the proton number because neutrons provide the electrostatic repulsion needed for stability.","source":"expert-authored","flags":[]}],"source":"2021 TZ2 SL Q4(b); 2021 TZ2 HL Q4(b)","custom":false,"distractors":["The nucleus has too many neutrons, so the strong force becomes repulsive and the nucleus is unstable.","The neutron number is greater than the proton number because neutrons provide the electrostatic repulsion needed for stability."]},{"id":"q066","topic":"C4","topic_title":"Standing waves and resonance","label":"[SL + HL]","question":"Outline how a standing wave forms in the tube.","marks":2,"markGroups":[{"mark":1,"options":["sound wave travels down tube and is reflected"]},{"mark":2,"options":["incident and reflected wave superpose/combine/interfere"]}],"fullAnswer":"sound wave travels down tube and is reflected; incident and reflected wave superpose/combine/interfere","valid":["sound wave travels down tube and is reflected","incident and reflected wave superpose/combine/interfere"],"candidates":[{"text":"The sound wave is completely absorbed at the closed end, so no standing wave forms.","source":"expert-authored","flags":[]},{"text":"The tube produces a standing wave because the air particles travel along the tube with  exist.","marks":3,"markGroups":[{"mark":1,"options":["Strong force is short range & electromagnetic force is long range"]},{"mark":2,"options":["Strong force is attractive between nucleons; Electromagnetic force is repulsive between protons"]},{"mark":3,"options":["Overall, the strong force dominates"]}],"fullAnswer":"Strong force is short range & electromagnetic force is long range; Strong force is attractive between nucleons; Electromagnetic force is repulsive between protons; Overall, the strong force dominates","valid":["Strong force is short range & electromagnetic force is long range","Strong force is attractive between nucleons; Electromagnetic force is repulsive between protons","Overall, the strong force dominates"],"candidates":[{"text":"The strong force is long range and repulsive, while the electromagnetic force is short range and attractive.","source":"expert-authored","flags":[]},{"text":"The strong force acts only between protons, while the electromagnetic force acts between all nucleons.","source":"expert-authored","flags":[]}],"source":"2023 TZ2 SL Q5(c)","custom":false,"distractors":["The strong force acts only between protons, while the electromagnetic force acts between all nucleons."]},{"id":"q069","topic":"E3","topic_title":"Radioactive decay","label":"[HL only]","question":"Compare the properties of the strong nuclear force and of the electromagnetic force that allow the helium nucleus to be stable.","marks":3,"markGroups":[{"mark":1,"options":["Strong force is short range & electromagnetic force is long range"]},{"mark":2,"options":["Strong force is attractive between nucleons and Electromagnetic force is repulsive between protons"]},{"mark":3,"options":["Overall, the strong force dominates"]}],"fullAnswer":"Strong force is short range & electromagnetic force is long range; Strong force is attractive between nucleons and Electromagnetic force is repulsive between protons; Overall, the strong force dominates","valid":["Strong force is short range & electromagnetic force is long range","Strong force is attractive between nucleons and Electromagnetic force is repulsive between protons","Overall, the strong force dominates"],"candidates":[{"text":"The strong force is weaker than the electromagnetic force at all separation distances.","source":"expert-authored","flags":[]},{"text":"The electromagnetic force is attractive between protons, while the strong force is repulsive between nucleons.","source":"expert-authored","flags":[]}],"source":"2023 TZ2 HL Q5(d)","custom":false,"distractors":["The strong force is weaker than the electromagnetic force at all separation distances."]},{"id":"q070","topic":"E3","topic_title":"Radioactive decay","label":"[HL only]","question":"A beta-minus particle and an alpha particle have the same initial kinetic energy. Outline why the beta-minus particle can travel further in air than the alpha particle.","marks":2,"markGroups":[{"mark":1,"options":["Alphas have double charge and so are better ionisers"]},{"mark":2,"options":["alphas have more mass and therefore slower for same energy","so longer time/more likely to interact with the atomic electrons/atoms and therefore better ionisers"]}],"fullAnswer":"Alphas have double charge and so are better ionisers; alphas have more mass and therefore slower for same energy OR so longer time/more likely to interact with the atomic electrons/atoms and therefore better ionisers","valid":["Alphas have double charge and so are better ionisers","alphas have more mass and therefore slower for same energy","so longer time/more likely to interact with the atomic electrons/atoms and therefore better ionisers"],"candidates":[{"text":"Alpha particles travel further because they have less charge and interact less with air molecules.","source":"expert-authored","flags":[]},{"text":"Beta particles travel further because they have more mass and therefore more kinetic energy.","source":"expert-authored","flags":[]}],"source":"2023 TZ2 HL Q5(e)","custom" ctive forces between gas molecules, not by collisions with the walls.","source":"expert-authored","flags":[]}],"source":"2024 TZ1 SL Q3(c); 2024 TZ1 HL Q3(c)","custom":false,"distractors":["Temperature is proportional to the total momentum of the molecules, while pressure is proportional to their volume.","Pressure is caused by the attractive forces between gas molecules, not by collisions with the walls."]},{"id":"q072","topic":"C3","topic_title":"Wave phenomena","label":"[SL + HL]","question":"Explain the change in the wavelength of the light going from water to air.","marks":2,"markGroups":[{"mark":1,"options":["speed increases and frequency unchanged"]},{"mark":2,"options":["from c = fλ the wavelength increases"]}],"fullAnswer":"speed increases and frequency unchanged; from c = fλ the wavelength increases","valid":["speed increases and frequency unchanged","from c = fλ the wavelength increases"],"candidates":[{"text":"The speed decreases and the frequency decreases, so the wavelength stays the same.","source":"expert-authored","flags":[]},{"text":"The frequency increases and the speed stays the same, so the wavelength increases.","source":"expert-authored","flags":[]}],"source":"2024 TZ1 SL Q4(b); 2024 TZ1 HL Q4(b)","custom":false,"distractors":["The speed decreases and the frequency decreases","The frequency increases and the speed stays the same","from c = fλ wavelength decreases"]},{"id":"q073","topic":"E5","topic_title":"Fusion and stars","label":"[SL]","question":"Deuterium, ²₁H, and tritium undergo nuclear fusion according to ²₁H + ³₁H → X + ¹₀n. Outline why mass is not conserved in this reaction.","marks":1,"markGroups":[{"mark":1,"options":["some of the mass of the reactants converted to energy according to ΔE = Δmc²"]}],"fullAnswer":"some of the mass of the reactants converted to energy according to ΔE = Δmc²","valid":["some of the mass of the reactants converted to energy according to ΔE = Δmc²"],"candidates":[{"text":"Mass is not conserved because one const THEMES = {
  A:'Space, time and motion',
  B:'The particulate nature of matter',
  C:'Wave behaviour',
  D:'Fields',
  E:'Nuclear and quantum physics',
  T:'Mathematics (units and measurement)'
};

const LEVEL_KEY='ib-quiz-level';
const savedLevel=localStorage.getItem(LEVEL_KEY);
const state = {
  view:'topics',
  mode:'topic',
  selection:null,
  label:'',
  level:(savedLevel==='SL'||savedLevel==='HL')?savedLevel:null,
  round:[],
  index:0,
  selected:new Set(),
  options:[],
  revealed:false,
  answers:[]
};

/* ---------- helpers ---------- */
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2100);}
function questionLevel(q){
  const l=(q.label||'').toLowerCase();
  if(l.includes('hl only')) return 'HL';
  if(l.includes('sl only')) return 'SL';
  return 'BOTH';
}
function levelAllowed(q,level){
  if(level==='HL') return true;
  return questionLevel(q)!=='HL';
}
function levelQuestionsFor(level){return DATA.questions.filter(q=>levelAllowed(q,level));}
function levelQuestions(){return levelQuestionsFor(state.level);}
function questionsFor(code){return levelQuestions().filter(q=>q.topic===code);}
function topicTitle(code){const t=DATA.topics.find(x=>x[0]===code);return t?t[1]:code;}
function countFor(code){return questionsFor(code).length;}
function questionsForTheme(L){return levelQuestions().filter(q=>q.topic[0]===L);}
function countForTheme(L){return questionsForTheme(L).length;}
function isMC(q){return q.kind==='mc';}
function mcQuestions(){return levelQuestions().filter(isMC);}

function setLevel(level){
  if(level!=='SL'&&level!=='HL') return;
  state.level=level;
  localStorage.setItem(LEVEL_KEY,level);
  renderTopics();
  window.scrollTo({top:0,behavior:'smooth'});
}
function changeLevel(){
  state.level=null;
  localStorage.removeItem(LEVEL_KEY);
  renderTopics();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderLevelChooser(){
  const ct=document.getElementById('changeTopicBtn'); if(ct) ct.classList.add('hidden');
  const sl=levelQuestionsFor('SL'), hl=levelQuestionsFor('HL');
  const slMc=sl.filter(isMC).length, hlMc=hl.filter(isMC).length;
  document.getElementById('app').innerHTML=`
    <div class="hero">
      <h1>IB Physics - Things Must Not be Forgotten</h1>
      <p>Choose your study level to begin.</p>
    </div>
    <div class="card levelgate">
      <h2>Choose your level</h2>
      <p>Your choice filters every topic and mixed round. You can change it later.</p>
      <div class="levelchoices">
        <button class="levelchoice" onclick="setLevel('SL')">
          <div class="big">SL</div>
          <div class="name">Standard Level</div>
          <div class="count">${sl.length} questions</div>
          <div class="desc">${sl.length-slMc} recall + ${slMc} Paper 1 MC. HL-only content is hidden.</div>
        </button>
        <button class="levelchoice" onclick="setLevel('HL')">
          <div class="big">HL</div>
          <div class="name">Higher Level</div>
          <div class="count">${hl.length} questions</div>
          <div class="desc">${hl.length-hlMc} recall + ${hlMc} Paper 1 MC. Includes SL and HL content.</div>
        </button>
      </div>
      <p class="levelnote">This choice is saved on this device.</p>
    </div>`;
}

/* ---------- topic page ---------- */
function renderTopics(){
  if(!state.level){renderLevelChooser();return;}
  const ct=document.getElementById('changeTopicBtn'); if(ct) ct.classList.add('hidden');
  const themes={};
  DATA.topics.forEach(([code,title])=>{
    const L=code[0];
    (themes[L]=themes[L]||[]).push([code,title]);
  });
  const order=['A','B','C','D','E','T'];
  const mixCards=order.map(L=>{
    const n=countForTheme(L);
    if(n===0) return '';
    const countText=n<=10?`All ${n} question${n===1?'':'s'}`:`10 random from ${n} questions`;
    return `<button class="topic" onclick="startMixed('${L}')">
      <div class="code">MIX ${L}</div>
      <div class="name">${esc(THEMES[L])}</div>
      <div class="count">${countText}</div>
    </button>`;
  }).join('');
  const mcN=mcQuestions().length;
  const mcCard=mcN?`<button class="topic" onclick="startMCMix()">
      <div class="code">P1 MC</div>
      <div class="name">Paper 1 Definition MC</div>
      <div class="count">${mcN<=10?`All ${mcN} questions`:`10 random from ${mcN} questions`}</div>
    </button>`:'';
  const allCount=levelQuestions().length;
  const allCountText=allCount<=10?`All ${allCount} questions`:`10 random from ${allCount} questions`;
  const allCard=allCount?`<button class="topic" onclick="startMixed('ALL')">
      <div class="code">MIX ALL</div>
      <div class="name">All topics</div>
      <div class="count">${allCountText}</div>
    </button>`:'';
  const sections=order.map(L=>{
    if(!themes[L]) return '';
    const cards=themes[L].map(([code,title])=>{
      const n=countFor(code);
      if(n===0) return '';
      return `<button class="topic" onclick="startTopic('${code}')">
        <div class="code">${code}</div>
        <div class="name">${esc(title)} (${n} question${n===1?'':'s'})</div>
        <div class="count">All questions shown</div>
      </button>`;
    }).filter(Boolean).join('');
    if(!cards) return '';
    const label=L==='T'?'Tools':`Theme ${L}`;
    return `<h2 class="theme">${label} — ${esc(THEMES[L])}</h2><div class="grid">${cards}</div>`;
  }).join('');
  const recallN=allCount-mcN;
  document.getElementById('app').innerHTML=`
    <div class="hero">
      <h1>IB Physics - Things Must Not be Forgotten</h1>
      <p>${recallN} recall + ${mcN} Paper 1 MC · choose a topic or quick round.</p>
    </div>
    <div class="levelbar">
      <div class="levelbadge">${state.level}</div>
      <div class="levelcopy"><b>${state.level==='SL'?'Standard Level':'Higher Level'} mode</b><span>${state.level==='SL'?'Showing shared SL+HL and SL-only questions. HL-only content is hidden.':'Showing all SL, shared and HL questions.'}</span></div>
      <button class="btn ghost" onclick="changeLevel()">Change level</button>
    </div>
    <h2 class="theme">Mixed practice</h2>
    <div class="grid">${mcCard}${mixCards}${allCard}</div>
    ${sections}`;
}

/* ---------- quiz ---------- */
function currentQ(){return state.round[state.index];}
function makeOptions(q){
  if(isMC(q)) return ['A','B','C','D'].map(l=>({letter:l,text:l,group:null,correct:l===q.answer}));
  const arr=[];
  q.markGroups.forEach((g,gi)=>g.options.forEach(t=>arr.push({text:t,group:gi,correct:true})));
  q.distractors.forEach(t=>arr.push({text:t,group:null,correct:false}));
  return shuffle(arr);
}
function startTopic(code){
  const qs=questionsFor(code);
  if(!qs.length){toast('No questions in this topic.');return;}
  state.mode='topic'; state.selection=code; state.label=`${code} — ${topicTitle(code)}`;
  state.round=qs.slice();
  state.index=0;
  state.answers=[];
  state.selected=new Set();
  state.revealed=false;
  state.options=makeOptions(currentQ());
  state.view='quiz';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
function startMixed(scope){
  const qs=scope==='ALL'?levelQuestions():questionsForTheme(scope);
  if(!qs.length){toast('No questions in this selection.');return;}
  state.mode=scope==='ALL'?'all':'theme';
  state.selection=scope;
  state.label=scope==='ALL'?'all topics':`Theme ${scope} — ${THEMES[scope]}`;
  state.round=shuffle(qs).slice(0,10);
  state.index=0;
  state.answers=[];
  state.selected=new Set();
  state.revealed=false;
  state.options=makeOptions(currentQ());
  state.view='quiz';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
function startMCMix(){
  const qs=mcQuestions();
  if(!qs.length){toast('No Paper 1 MC questions available.');return;}
  state.mode='mc'; state.selection='MC'; state.label='Paper 1 Definition MC';
  state.round=shuffle(qs).slice(0,10);
  state.index=0;
  state.answers=[];
  state.selected=new Set();
  state.revealed=false;
  state.options=makeOptions(currentQ());
  state.view='quiz';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuiz(){
  const ct=document.getElementById('changeTopicBtn'); if(ct) ct.classList.remove('hidden');
  const q=currentQ();
  if(!q){finishTopic();return;}
  const total=state.round.length;
  const pct=Math.round(((state.index+(state.revealed?1:0))/total)*100);
  const levelClass=q.label==='[HL only]'?'hl':'';
  const mc=isMC(q);
  const meta=mc?`<span class="pill topic">${q.topic} · ${esc(q.topic_title)}</span>
        <span class="pill paper">Paper 1</span>
        <span class="pill level ${levelClass}">${esc(q.label)}</span>`
    :`<span class="pill topic">${q.topic} · ${esc(q.topic_title)}</span>
        <span class="pill level ${levelClass}">${esc(q.label)}</span>`;
  const body=mc?`
      <div class="mc-head">
        <span class="pill type">${esc(q.type||'Definition')}</span>
        <span class="mc-src">${esc(q.id)} · ${esc(q.occurrences)}</span>
      </div>
      <button type="button" class="qimg-wrap" onclick="openZoom()" aria-label="Open question image at full size">
        <img class="qimg" src="${esc(q.image)}" width="${q.displayW}" height="${q.displayH}" alt="${esc(q.alt)}" loading="eager">
      </button>
      <p class="zoomhint">Click or tap the question image to zoom.</p>
      <div class="select-label">Choose one option</div>
      <div id="options">${optionsHtml(q)}</div>
      <div id="feedback">${state.revealed?feedbackHtml(q):''}</div>`
    :`
      <h2 class="q">${esc(q.question)} [${q.marks}]</h2>
      <p class="src">${esc(q.source)}</p>
      <div class="select-label">Select ${q.marks}</div>
      <div id="options">${optionsHtml(q)}</div>
      <div id="feedback">${state.revealed?feedbackHtml(q):''}</div>`;
  document.getElementById('app').innerHTML=`
    <div class="quiz-top">
      <button class="btn ghost" onclick="goTopics()">← Topics</button>
      <div class="quiz-meta">${meta}<span class="pill counter">Question ${state.index+1} of ${total}</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card">
      ${body}
      <div class="footer">
        <span class="count" id="selCount">${state.selected.size} / ${q.marks} selected</span>
        <div>
          <button class="btn primary ${state.revealed?'hidden':''}" id="submitBtn" onclick="submitAnswer()" ${state.selected.size===q.marks?'':'disabled'}>Submit</button>
          <button class="btn primary ${state.revealed?'':'hidden'}" id="nextBtn" onclick="nextQuestion()">${state.index+1<total?'Next →':'Finish topic →'}</button>
        </div>
      </div>
    </div>`;
}
function optionsHtml(q){
  if(isMC(q)){
    return `<div class="mc-grid">${state.options.map((o,i)=>{
      const checked=state.selected.has(i);
      const cls=state.revealed?(o.correct?'correct':checked?'wrong':''):(checked?'checked':'');
      return `<button type="button" class="mc-choice ${cls}" onclick="toggleOpt(${i})" ${state.revealed?'disabled':''} aria-pressed="${checked}" aria-label="Option ${o.letter}">${o.letter}</button>`;
    }).join('')}</div>`;
  }
  return state.options.map((o,i)=>{
    const checked=state.selected.has(i);
    const disabled=state.revealed||isDisabled(o,i,q);
    return `<label class="opt ${checked?'checked':''} ${disabled?'disabled':''}">
      <input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} onchange="toggleOpt(${i})">
      <span class="txt">${esc(o.text)}</span>
    </label>`;
  }).join('');
}
function isDisabled(o,i,q){
  if(state.revealed) return true;
  if(state.selected.has(i)) return false;
  if(state.selected.size<q.marks) return false;
  if(o.group!==null && [...state.selected].some(j=>state.options[j].group===o.group)) return false;
  return true;
}
function updateSelectionUI(){
  const q=currentQ();
  document.getElementById('options').innerHTML=optionsHtml(q);
  document.getElementById('selCount').textContent=`${state.selected.size} / ${q.marks} selected`;
  document.getElementById('submitBtn').disabled=state.selected.size!==q.marks;
}
function toggleOpt(i){
  if(state.revealed) return;
  const q=currentQ();
  if(isMC(q)){state.selected=new Set([i]);updateSelectionUI();return;}
  const o=state.options[i];
  if(state.selected.has(i)){state.selected.delete(i);updateSelectionUI();return;}
  if(o.group!==null){
    for(const j of [...state.selected]) if(state.options[j].group===o.group) state.selected.delete(j);
    if(state.selected.size>=q.marks){toast(`Select exactly ${q.marks}. Unselect one first.`);updateSelectionUI();return;}
    state.selected.add(i);
  }else{
    if(state.selected.size>=q.marks){toast(`Select exactly ${q.marks}. Unselect one first.`);return;}
    state.selected.add(i);
  }
  updateSelectionUI();
}
function submitAnswer(){
  const q=currentQ();
  if(state.selected.size!==q.marks) return;
  if(isMC(q)){
    const chosen=[...state.selected].map(i=>state.options[i]);
    const result=chosen[0]&&chosen[0].correct?'correct':'learn';
    state.answers.push({qid:q.id,selected:chosen.map(o=>o.text),count:result==='correct'?1:0,result});
    state.revealed=true;
    renderQuiz();
    document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const chosen=[...state.selected].map(i=>state.options[i]);
  const count=chosen.filter(o=>o.correct).length;
  const groups=new Set(chosen.filter(o=>o.correct).map(o=>o.group));
  const exact=count===q.marks && groups.size===q.marks;
  let result='learn';
  if(exact) result='correct';
  else if(count>=1) result='almost';
  state.answers.push({qid:q.id,selected:chosen.map(o=>o.text),count,result});
  state.revealed=true;
  renderQuiz();
  document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'});
}
function feedbackHtml(q){
  const a=state.answers[state.answers.length-1];
  if(!a) return '';
  if(isMC(q)){
    const ok=a.result==='correct';
    const chosen=a.selected[0]||'—';
    return `<div class="fb ${a.result}"><span>${ok?'Correct':'Time to learn!'}</span><span>${ok?'1 / 1':'0 / 1'}</span></div>
      <div class="note">${ok?'You chose the correct option.':`You chose ${chosen}. The correct option is ${q.answer}.`}</div>
      <div class="reveal">
        <h3>Answer</h3>
        <div class="mc-answer"><b>${q.answer}</b><span>Official markscheme letter</span></div>
        <p class="note">Seen in: ${esc(q.occurrences)}</p>
        ${q.reason?`<p class="note">${esc(q.reason)}</p>`:''}
      </div>`;
  }
  const title=a.result==='correct'?'Correct':a.result==='almost'?'Almost there':'Time to learn!';
  const sub=a.result==='correct'?'You selected a correct option for every mark.':a.result==='almost'?`${a.count} of ${q.marks} correct — check the missing or wrong option.`:'None of your selected options were correct.';
  const selected=new Set(a.selected);
  const groups=q.markGroups.map(g=>`<div class="mg"><div class="mg-label">Mark ${g.mark}</div><ul>${g.options.map(t=>`<li class="${selected.has(t)?'picked':''}">${esc(t)}${selected.has(t)?'<span class="tag">your choice</span>':''}</li>`).join('')}</ul></div>`).join('');
  const wrong=a.selected.filter(t=>!q.markGroups.some(g=>g.options.includes(t)));
  const note=q.markGroups.length>q.marks?`Any ${q.marks} of these ${q.markGroups.length} valid mark groups count.`:'';
  return `<div class="fb ${a.result}"><span>${title}</span><span>${a.count} / ${q.marks}</span></div>
    <div class="note">${esc(sub)}</div>
    <div class="reveal">
      <h3>Answers — marking-scheme order</h3>
      ${groups}
      <div class="full"><b>Full mark-scheme answer</b><p>${esc(q.fullAnswer)}</p></div>
      ${note?`<p class="note">${esc(note)}</p>`:''}
      ${wrong.length?`<p class="wrongline">Your incorrect selection${wrong.length===1?'':'s'}: ${wrong.map(esc).join('; ')}</p>`:''}
    </div>`;
}
function nextQuestion(){
  if(state.index+1>=state.round.length){finishTopic();return;}
  state.index++;
  state.selected=new Set();
  state.revealed=false;
  state.options=makeOptions(currentQ());
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
function finishTopic(){
  const allCorrect=state.answers.length===state.round.length && state.answers.every(a=>a.result==='correct');
  state.view=allCorrect?'complete':'retry';
  if(allCorrect) renderComplete(); else renderRetry();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goTopics(){state.view='topics';state.mode='topic';state.selection=null;state.label='';renderTopics();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- completion / retry ---------- */
function completionScope(){
  if(state.mode==='topic') return `all the questions in topic ${state.label}`;
  if(state.mode==='mc') return 'this Paper 1 definition MC round';
  if(state.mode==='theme') return `this mixed round from ${state.label}`;
  return 'this mixed round from all topics';
}
function retryScope(){
  if(state.mode==='topic') return `topic ${state.label}`;
  if(state.mode==='mc') return 'this Paper 1 definition MC round';
  if(state.mode==='theme') return `this mixed round from ${state.label}`;
  return 'this mixed round from all topics';
}
function replaySelection(){
  if(state.mode==='topic') startTopic(state.selection);
  else if(state.mode==='mc') startMCMix();
  else startMixed(state.selection);
}
function renderComplete(){
  const ct=document.getElementById('changeTopicBtn'); if(ct) ct.classList.remove('hidden');
  const redo=state.mode==='topic'?'Redo this topic':state.mode==='mc'?'New MC round':'New mixed round';
  document.getElementById('app').innerHTML=`
    <div class="card result">
      <h1>Yay you have finished ${esc(completionScope())}!! (Please screencap)</h1>
      <div class="footer" style="justify-content:center;margin-top:22px">
        <button class="btn primary" onclick="replaySelection()">${redo}</button>
        <button class="btn ghost" onclick="goTopics()">Choose another topic</button>
      </div>
    </div>`;
}
function renderRetry(){
  const ct=document.getElementById('changeTopicBtn'); if(ct) ct.classList.remove('hidden');
  const total=state.round.length;
  const correct=state.answers.filter(a=>a.result==='correct').length;
  const almost=state.answers.filter(a=>a.result==='almost').length;
  const learn=state.answers.filter(a=>a.result==='learn').length;
  const retry=state.mode==='topic'?'Try again':state.mode==='mc'?'New MC round':'New mixed round';
  document.getElementById('app').innerHTML=`
    <div class="card result">
      <h1>Not quite yet!</h1>
      <p>You have finished <b>${esc(retryScope())}</b>, but you did not get every question correct.</p>
      <div class="score">
        <div class="scorebox"><b>${correct} / ${total}</b><span>Fully correct</span></div>
        <div class="scorebox"><b>${almost}</b><span>Almost there</span></div>
        <div class="scorebox"><b>${learn}</b><span>Time to learn!</span></div>
      </div>
      <p style="margin-top:18px">Try again to unlock the completion page.</p>
      <div class="footer" style="justify-content:center">
        <button class="btn primary" onclick="replaySelection()">${retry}</button>
        <button class="btn ghost" onclick="goTopics()">Choose another topic</button>
      </div>
    </div>`;
}

/* ---------- image zoom ---------- */
function openZoom(){
  const q=currentQ();
  if(!isMC(q)) return;
  const modal=document.getElementById('imgModal');
  const img=document.getElementById('zoomImg');
  img.src=q.image;
  img.alt=q.alt||q.id;
  modal.classList.remove('hidden');
  document.body.classList.add('locked');
  modal.scrollTop=0;
  modal.scrollLeft=0;
}
function closeZoom(e){
  if(e && e.target && e.target.id==='zoomImg') return;
  const modal=document.getElementById('imgModal');
  modal.classList.add('hidden');
  modal.querySelector('img').removeAttribute('src');
  document.body.classList.remove('locked');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeZoom();});

/* ---------- boot ---------- */
renderTopics();
</script>
</body>
</html>
